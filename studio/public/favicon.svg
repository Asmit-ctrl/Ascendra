<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Perfect circle background -->
  <circle cx="128" cy="128" r="128" fill="url(#grad1)"/>
  
  <!-- Book/Education symbol - left side -->
  <path d="M 80 100 L 80 180 Q 80 190 90 190 L 110 190 Q 120 190 120 180 L 120 100" 
        fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Book spine -->
  <line x1="90" y1="100" x2="90" y2="190" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- AI/Brain symbol - right side -->
  <circle cx="170" cy="120" r="8" fill="white"/>
  <circle cx="190" cy="130" r="8" fill="white"/>
  <circle cx="170" cy="150" r="8" fill="white"/>
  <circle cx="190" cy="160" r="8" fill="white"/>
  
  <!-- Connecting lines (neural network) -->
  <line x1="170" y1="120" x2="190" y2="130" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="190" y1="130" x2="170" y2="150" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="170" y1="150" x2="190" y2="160" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="170" y1="120" x2="170" y2="150" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Center accent - connecting education and AI -->
  <circle cx="128" cy="140" r="4" fill="white" opacity="0.7"/>
  
  <!-- Outer ring accent -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
