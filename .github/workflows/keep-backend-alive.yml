name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes to keep Render backend awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SyncSenta Backend
        run: |
          echo "Pinging backend at $(date)"
          curl -f https://ascendra-e3jc.onrender.com/healthz || exit 1
          echo "Backend is alive!"
