<?xml version="1.0" encoding="UTF-8"?>
<!-- iOS App Icon 1024x1024 - Optimized for iOS rounded square format -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradients for app icon -->
    <linearGradient id="iosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iosAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="iosGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect width="1024" height="1024" fill="url(#iosGradient)"/>
  
  <!-- Subtle glow effect -->
  <circle cx="512" cy="512" r="480" fill="url(#iosGlow)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="white" stroke-width="20" opacity="0.15"/>
  
  <!-- Central knowledge hub -->
  <circle cx="512" cy="512" r="85" fill="white" opacity="0.95"/>
  
  <!-- Three curved learning paths with enhanced detail -->
  <!-- Path 1: Top-right (Digital Learning) -->
  <g transform="rotate(0 512 512)">
    <path d="M 512 512 Q 660 370 740 415 Q 775 435 740 480 Q 660 560 580 515" 
          fill="white" opacity="0.92"/>
    <circle cx="740" cy="447" r="52" fill="url(#iosAccent)"/>
    <!-- Enhanced book icon -->
    <g transform="translate(740, 447)">
      <rect x="-20" y="-18" width="40" height="36" rx="3" fill="white" opacity="0.95"/>
      <line x1="-12" y1="-12" x2="-12" y2="12" stroke="url(#iosGradient)" stroke-width="2.5"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#iosGradient)" stroke-width="2.5"/>
      <line x1="12" y1="-12" x2="12" y2="12" stroke="url(#iosGradient)" stroke-width="2.5"/>
    </g>
  </g>
  
  <!-- Path 2: Bottom-left (Collaboration) -->
  <g transform="rotate(120 512 512)">
    <path d="M 512 512 Q 660 370 740 415 Q 775 435 740 480 Q 660 560 580 515" 
          fill="white" opacity="0.92"/>
    <circle cx="740" cy="447" r="52" fill="url(#iosAccent)"/>
    <!-- Enhanced network icon -->
    <g transform="translate(740, 447)">
      <circle cx="-12" cy="-8" r="6" fill="white"/>
      <circle cx="12" cy="-8" r="6" fill="white"/>
      <circle cx="0" cy="10" r="6" fill="white"/>
      <line x1="-12" y1="-8" x2="12" y2="-8" stroke="white" stroke-width="3"/>
      <line x1="-12" y1="-8" x2="0" y2="10" stroke="white" stroke-width="3"/>
      <line x1="12" y1="-8" x2="0" y2="10" stroke="white" stroke-width="3"/>
    </g>
  </g>
  
  <!-- Path 3: Bottom-right (Innovation) -->
  <g transform="rotate(240 512 512)">
    <path d="M 512 512 Q 660 370 740 415 Q 775 435 740 480 Q 660 560 580 515" 
          fill="white" opacity="0.92"/>
    <circle cx="740" cy="447" r="52" fill="url(#iosAccent)"/>
    <!-- Enhanced lightbulb icon -->
    <g transform="translate(740, 447)">
      <circle cx="0" cy="-5" r="14" fill="none" stroke="white" stroke-width="3"/>
      <rect x="-8" y="9" width="16" height="8" rx="2" stroke="white" stroke-width="3" fill="none"/>
      <line x1="0" y1="17" x2="0" y2="22" stroke="white" stroke-width="3"/>
    </g>
  </g>
  
  <!-- Central Syncsenta 'S' symbol with enhanced styling -->
  <path d="M 512 460 Q 550 460 550 490 Q 550 520 512 520 Q 474 520 474 550 Q 474 580 512 580" 
        stroke="url(#iosGradient)" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Data flow indicators -->
  <circle cx="512" cy="420" r="8" fill="url(#iosAccent)"/>
  <circle cx="512" cy="604" r="8" fill="url(#iosAccent)"/>
  
  <!-- Orbital rings for continuous learning -->
  <ellipse cx="512" cy="512" rx="290" ry="330" fill="none" stroke="white" 
           stroke-width="4" opacity="0.12" stroke-dasharray="25,18"/>
  <ellipse cx="512" cy="512" rx="330" ry="290" fill="none" stroke="white" 
           stroke-width="4" opacity="0.12" stroke-dasharray="25,18"/>
  
  <!-- Subtle corner accents for depth -->
  <circle cx="180" cy="180" r="40" fill="white" opacity="0.05"/>
  <circle cx="844" cy="180" r="40" fill="white" opacity="0.05"/>
  <circle cx="180" cy="844" r="40" fill="white" opacity="0.05"/>
  <circle cx="844" cy="844" r="40" fill="white" opacity="0.05"/>
</svg>

