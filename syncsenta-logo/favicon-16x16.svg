<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified background circle -->
  <circle cx="8" cy="8" r="7.5" fill="url(#grad16)"/>
  
  <!-- Central white circle -->
  <circle cx="8" cy="8" r="2.5" fill="white"/>
  
  <!-- Three simplified curved paths -->
  <g opacity="0.9">
    <!-- Top path -->
    <path d="M 8 8 Q 10.5 6.5 11.5 7.5 Q 11.8 8 11.2 8.5 Q 10 9.5 9 8.5" fill="white"/>
    
    <!-- Bottom-left path -->
    <g transform="rotate(120 8 8)">
      <path d="M 8 8 Q 10.5 6.5 11.5 7.5 Q 11.8 8 11.2 8.5 Q 10 9.5 9 8.5" fill="white"/>
    </g>
    
    <!-- Bottom-right path -->
    <g transform="rotate(240 8 8)">
      <path d="M 8 8 Q 10.5 6.5 11.5 7.5 Q 11.8 8 11.2 8.5 Q 10 9.5 9 8.5" fill="white"/>
    </g>
  </g>
  
  <!-- Simplified S shape in center -->
  <path d="M 8 6.5 Q 9 6.5 9 7.5 Q 9 8.5 8 8.5 Q 7 8.5 7 9.5" 
        stroke="url(#grad16)" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>

