<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo with Syncsenta wordmark for horizontal layouts -->
<svg width="2048" height="512" viewBox="0 0 2048 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="wordmarkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo symbol (scaled and positioned) -->
  <g transform="translate(256, 256) scale(0.45)">
    <circle cx="0" cy="0" r="480" fill="url(#wordmarkGrad)"/>
    <circle cx="0" cy="0" r="420" fill="none" stroke="white" stroke-width="24" opacity="0.2"/>
    <circle cx="0" cy="0" r="80" fill="white"/>
    
    <g transform="rotate(0 0 0)">
      <path d="M 0 0 Q 138 -132 208 -92 Q 238 -72 208 -32 Q 138 38 68 0" 
            fill="white" opacity="0.9"/>
      <circle cx="208" cy="-62" r="45" fill="url(#wordmarkAccent)"/>
    </g>
    
    <g transform="rotate(120 0 0)">
      <path d="M 0 0 Q 138 -132 208 -92 Q 238 -72 208 -32 Q 138 38 68 0" 
            fill="white" opacity="0.9"/>
      <circle cx="208" cy="-62" r="45" fill="url(#wordmarkAccent)"/>
    </g>
    
    <g transform="rotate(240 0 0)">
      <path d="M 0 0 Q 138 -132 208 -92 Q 238 -72 208 -32 Q 138 38 68 0" 
            fill="white" opacity="0.9"/>
      <circle cx="208" cy="-62" r="45" fill="url(#wordmarkAccent)"/>
    </g>
    
    <path d="M 0 -42 Q 28 -42 28 -22 Q 28 -2 0 -2 Q -28 -2 -28 18 Q -28 38 0 38" 
          stroke="url(#wordmarkGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Syncsenta wordmark -->
  <g transform="translate(580, 256)">
    <!-- S -->
    <path d="M 50 -80 Q 100 -80 100 -40 Q 100 -10 70 0 Q 40 10 40 40 Q 40 70 80 70 L 90 70" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- y -->
    <path d="M 150 -60 L 150 20 Q 150 80 110 100" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 150 -60 Q 180 -60 200 -40 L 200 20" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- n -->
    <path d="M 260 -60 L 260 20" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 260 -40 Q 290 -60 320 -60 Q 350 -60 350 -30 L 350 20" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- c -->
    <path d="M 440 -40 Q 410 -60 380 -60 Q 350 -60 350 -20 Q 350 20 380 20 Q 410 20 440 0" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- s -->
    <path d="M 500 -50 Q 540 -60 560 -40 Q 570 -30 560 -20 Q 540 -10 520 -10 Q 500 -10 490 0 Q 480 10 490 20 Q 500 30 530 30 L 550 30" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- e -->
    <path d="M 610 -10 L 680 -10 Q 680 -40 650 -60 Q 620 -60 600 -40 Q 590 -20 590 0 Q 590 20 610 30 Q 640 30 670 10" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- n -->
    <path d="M 730 -60 L 730 20" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 730 -40 Q 760 -60 790 -60 Q 820 -60 820 -30 L 820 20" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- t -->
    <path d="M 880 -90 L 880 20 Q 880 40 900 40 L 920 40" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <line x1="860" y1="-60" x2="900" y2="-60" stroke="url(#wordmarkGrad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- a -->
    <path d="M 1000 -60 Q 1030 -60 1050 -40 L 1050 20 M 1050 -10 Q 1050 -40 1020 -50 Q 990 -50 980 -30 Q 980 -10 990 0 Q 1010 10 1050 0" 
          stroke="url(#wordmarkGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Tagline -->
  <text x="580" y="340" font-family="Arial, sans-serif" font-size="32" fill="#6B7280" letter-spacing="4">
    EDUCATIONAL TECHNOLOGY
  </text>
</svg>

