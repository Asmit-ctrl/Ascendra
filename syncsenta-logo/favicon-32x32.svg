<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad32)"/>
  
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
  
  <!-- Central hub -->
  <circle cx="16" cy="16" r="2.5" fill="white"/>
  
  <!-- Three curved learning paths -->
  <!-- Path 1: Top -->
  <g transform="rotate(0 16 16)">
    <path d="M 16 16 Q 20.5 12 22.5 13.5 Q 23.5 14.5 22.5 15.5 Q 20.5 17.5 18 16" 
          fill="white" opacity="0.9"/>
    <circle cx="22.5" cy="14.5" r="1.5" fill="url(#accent32)"/>
  </g>
  
  <!-- Path 2: Bottom-left -->
  <g transform="rotate(120 16 16)">
    <path d="M 16 16 Q 20.5 12 22.5 13.5 Q 23.5 14.5 22.5 15.5 Q 20.5 17.5 18 16" 
          fill="white" opacity="0.9"/>
    <circle cx="22.5" cy="14.5" r="1.5" fill="url(#accent32)"/>
  </g>
  
  <!-- Path 3: Bottom-right -->
  <g transform="rotate(240 16 16)">
    <path d="M 16 16 Q 20.5 12 22.5 13.5 Q 23.5 14.5 22.5 15.5 Q 20.5 17.5 18 16" 
          fill="white" opacity="0.9"/>
    <circle cx="22.5" cy="14.5" r="1.5" fill="url(#accent32)"/>
  </g>
  
  <!-- Central S shape -->
  <path d="M 16 14 Q 17.5 14 17.5 15.5 Q 17.5 17 16 17 Q 14.5 17 14.5 18.5" 
        stroke="url(#grad32)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Small connecting dots -->
  <circle cx="16" cy="13" r="0.8" fill="url(#accent32)"/>
  <circle cx="16" cy="19" r="0.8" fill="url(#accent32)"/>
</svg>

